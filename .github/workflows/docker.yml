name: "Docker"

on:
  workflow_dispatch:

  push:

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        include:
          - item: "8.5"
            target: "test-cli-8.5"
          - item: "8.5-fpm"
            target: "test-fpm-8.5"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Build image"
        uses: docker/build-push-action@v7
        with:
          context: "${{ matrix.item }}"
          load: true
          tags: "dockette/php:${{ matrix.item }}"

      - name: "Test image"
        run: "make ${{ matrix.target }}"

  build:
    name: "Build (${{ matrix.item }})"
    needs: ["test"]
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - item: "5.6"
          - item: "5.6-fpm"
          - item: "7.0"
          - item: "7.0-fpm"
          - item: "7.1"
          - item: "7.1-fpm"
          - item: "7.2"
          - item: "7.2-fpm"
          - item: "7.3"
          - item: "7.3-fpm"
          - item: "7.4"
          - item: "7.4-fpm"
          - item: "8.0"
          - item: "8.0-fpm"
          - item: "8.1"
          - item: "8.1-fpm"
          - item: "8.2"
          - item: "8.2-fpm"
          - item: "8.3"
          - item: "8.3-fpm"
          - item: "8.4"
          - item: "8.4-fpm"
          - item: "8.5"
          - item: "8.5-fpm"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # latest is also tagged <VERSION>, other tags <tag>-<VERSION>
      - name: "Read VERSION"
        id: version
        env:
          TAG: "${{ matrix.item }}"
        run: |
          v="$(cat VERSION)"
          grep -Eqx '[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?' <<<"$v" || { echo "::error file=VERSION::expected YYYY.MM.DD or YYYY.MM.DD.N, got '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = latest ]; then echo "tag=$v"; else echo "tag=$TAG-$v"; fi >> "$GITHUB_OUTPUT"

      # A build without a push needs no credentials (pull requests have no secrets).
      - name: "Login to DockerHub"
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Build and push"
        uses: docker/build-push-action@v7
        with:
          context: "${{ matrix.item }}"
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            dockette/php:${{ matrix.item }}
            dockette/php:${{ steps.version.outputs.tag }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          platforms: "linux/amd64,linux/arm64"
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tags the commit and publishes a GitHub release for VERSION the first
  # time it reaches master with the images pushed (make release bumps it).
  release:
    name: "Release"
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Create release if VERSION is new"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(cat VERSION)"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists"
            exit 0
          fi
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --generate-notes

  docs:
    name: "Docs"
    needs: ["build"]
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/php"
